<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtAd Studio — Marta Mescar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a090e;color:#e8e4f0;font-family:'Palatino Linotype',Palatino,Georgia,serif;min-height:100vh}
.header{background:#111018;border-bottom:1px solid #1e1c28;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:16px;font-weight:700;color:#c9a96e}
.header-sub{font-size:9px;color:#6b6480;letter-spacing:0.3em;font-family:monospace;margin-bottom:3px}
.body{padding:24px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#111018;border:1px solid #1e1c28;border-radius:10px;padding:16px;margin-bottom:14px}
.lbl{font-size:10px;color:#6b6480;letter-spacing:0.15em;font-family:monospace;margin-bottom:8px;display:block}
.drop-zone{border:2px dashed #1e1c28;border-radius:12px;min-height:220px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:10px;overflow:hidden;transition:border-color 0.2s;background:#1a1825}
.drop-zone:hover{border-color:#c9a96e}
.drop-zone.has-file{border-color:#c9a96e}
.drop-zone video,.drop-zone img{width:100%;display:block;max-height:320px;object-fit:contain}
.drop-placeholder{text-align:center;padding:32px}
.drop-placeholder .icon{font-size:36px;margin-bottom:10px}
.drop-placeholder p{color:#6b6480;font-size:14px}
.drop-placeholder small{color:#333;font-size:11px;margin-top:5px;display:block}
input[type=file]{display:none}
button{cursor:pointer;transition:all 0.15s;font-family:monospace}
.btn-primary{width:100%;padding:13px;background:#c9a96e;color:#000;border:none;border-radius:8px;font-size:14px;font-weight:700;letter-spacing:0.04em}
.btn-primary:disabled{background:#1a1825;color:#6b6480;cursor:not-allowed}
.btn-ghost{width:100%;padding:9px;background:transparent;color:#6b6480;border:1px solid #1e1c28;border-radius:8px;font-size:12px}
.btn-capture{width:100%;padding:11px;background:#1a1825;border:1px solid #1e1c28;color:#e8e4f0;border-radius:7px;font-size:13px;font-weight:600}
.btn-capture.captured{background:rgba(74,222,128,0.1);border-color:#4ade80;color:#4ade80}
.fmt-row{display:flex;gap:6px;flex-wrap:wrap}
.fmt-btn{padding:5px 12px;border-radius:20px;border:1px solid #1e1c28;background:transparent;color:#6b6480;font-size:11px}
.fmt-btn.active{border-color:#c9a96e;background:rgba(201,169,110,0.1);color:#c9a96e}
.obj-row{display:flex;gap:8px}
.obj-btn{flex:1;padding:9px 6px;border-radius:8px;border:1px solid #1e1c28;background:transparent;color:#6b6480;font-size:11px;text-align:center}
.obj-btn.active{border-color:#c9a96e;background:rgba(201,169,110,0.1);color:#c9a96e}
textarea,input[type=text]{width:100%;background:#1a1825;border:1px solid #1e1c28;border-radius:6px;color:#e8e4f0;padding:9px 12px;font-size:13px;font-family:Georgia,serif;resize:vertical;outline:none;line-height:1.6}
.spinner-wrap{text-align:center;padding:80px 20px}
.spinner{width:44px;height:44px;border:3px solid #1a1825;border-top-color:#c9a96e;border-radius:50%;animation:spin 0.9s linear infinite;margin:0 auto 22px}
@keyframes spin{to{transform:rotate(360deg)}}
.step-text{font-size:14px;color:#e8e4f0;margin-bottom:8px}
.step-sub{font-size:11px;color:#6b6480}
.progress-bar-wrap{max-width:360px;margin:12px auto}
.progress-track{background:#1a1825;border-radius:20px;height:5px;overflow:hidden}
.progress-fill{height:100%;background:#c9a96e;border-radius:20px;transition:width 0.3s}
.result-grid{display:grid;grid-template-columns:300px 1fr;gap:24px}
.output-toggle{display:flex;gap:6px;margin-bottom:10px}
.toggle-btn{flex:1;padding:8px;border-radius:7px;border:1px solid #1e1c28;background:transparent;color:#6b6480;font-size:11px}
.toggle-btn.active-video{border-color:#4ade80;background:rgba(74,222,128,0.1);color:#4ade80}
.toggle-btn.active-image{border-color:#c9a96e;background:rgba(201,169,110,0.1);color:#c9a96e}
.output-preview{border-radius:10px;overflow:hidden;border:1px solid #1e1c28;margin-bottom:10px;background:#1a1825}
.output-preview video,.output-preview img{width:100%;display:block}
.btn-download-video{width:100%;padding:12px;background:#4ade80;color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:0.06em;margin-bottom:8px;display:block;text-align:center;text-decoration:none}
.btn-download-image{width:100%;padding:12px;background:#c9a96e;color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:0.06em;margin-bottom:8px}
.tabs{display:flex;gap:1px;border-bottom:1px solid #1e1c28;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{padding:8px 14px;background:transparent;border:none;border-bottom:2px solid transparent;color:#6b6480;cursor:pointer;font-size:12px;font-family:monospace;letter-spacing:0.06em}
.tab-btn.active{border-bottom-color:#c9a96e;color:#c9a96e}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{background:#1a1825;border-radius:7px;padding:9px 12px}
.stat-label{font-size:9px;color:#6b6480;font-family:monospace;letter-spacing:0.1em;margin-bottom:3px}
.stat-value{font-size:12px;color:#e8e4f0;font-family:monospace;line-height:1.4}
.copy-field{margin-bottom:12px}
.copy-row{display:flex;gap:8px;align-items:flex-start}
.copy-value{flex:1;font-size:13px;color:#e8e4f0;line-height:1.7;background:#1a1825;border-radius:6px;padding:9px 12px}
.copy-btn{background:transparent;border:1px solid #1e1c28;color:#6b6480;border-radius:6px;padding:7px 11px;font-size:11px;flex-shrink:0;min-width:36px}
.copy-btn.copied{color:#4ade80;border-color:#4ade80}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.3);color:#c9a96e;margin:2px 3px 2px 0;font-family:monospace}
.insight-box{border-radius:10px;padding:14px;margin-bottom:12px}
.insight-blue{background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.25)}
.insight-gold{background:rgba(201,169,110,0.08);border:1px solid rgba(201,169,110,0.2)}
.insight-dark{background:#111018;border:1px solid #1e1c28}
.action-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.action-num{width:22px;height:22px;border-radius:50%;background:#c9a96e;color:#000;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.error-box{background:#2e1a1a;border:1px solid #5c2020;border-radius:8px;padding:10px 14px;color:#f87171;font-size:12px;font-family:monospace;margin-top:10px}
.hidden{display:none}
.copy-all-btn{padding:9px 18px;background:transparent;border:1px solid #1e1c28;color:#6b6480;border-radius:7px;font-size:12px;width:100%;margin-top:4px}
.copy-all-btn.copied{color:#4ade80;border-color:#4ade80}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-sub">META AD STUDIO · AI VIDEO + IMAGE EDITOR</div>
    <div class="header-title">Marta Mescar <span style="color:#2a2a2a;font-weight:400;font-size:13px">/ martamescar.com</span></div>
  </div>
  <button class="btn-ghost" id="resetBtn" style="width:auto;padding:7px 16px" onclick="resetApp()">↺ New</button>
</div>

<div class="body">

  <!-- UPLOAD STAGE -->
  <div id="uploadStage">
    <div class="grid">
      <div>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <div class="drop-placeholder" id="dropPlaceholder">
            <div class="icon">⊕</div>
            <p>Drop image or video here</p>
            <small>JPG · PNG · MP4 · MOV</small>
          </div>
          <video id="videoPreview" class="hidden" controls preload="auto"></video>
          <img id="imagePreview" class="hidden" alt="Preview">
        </div>
        <input type="file" id="fileInput" accept="image/*,video/*">
        <button class="btn-ghost" id="changeFileBtn" onclick="document.getElementById('fileInput').click()" style="display:none;margin-bottom:10px">↑ Change file</button>
        <div id="captureSection" class="hidden">
          <button class="btn-capture" id="captureBtn" onclick="captureFrame()">⬛ Pause video + Capture Frame</button>
        </div>
        <div id="errorBox" class="error-box hidden"></div>
      </div>

      <div>
        <div class="card">
          <span class="lbl">FORMAT</span>
          <div class="fmt-row" id="fmtRow">
            <button class="fmt-btn active" data-fmt='{"id":"feed","label":"Feed 1:1","w":1080,"h":1080}' onclick="selectFmt(this)">Feed 1:1</button>
            <button class="fmt-btn" data-fmt='{"id":"portrait","label":"Feed 4:5","w":1080,"h":1350}' onclick="selectFmt(this)">Feed 4:5</button>
            <button class="fmt-btn" data-fmt='{"id":"story","label":"Story/Reel 9:16","w":1080,"h":1920}' onclick="selectFmt(this)">Story/Reel 9:16</button>
            <button class="fmt-btn" data-fmt='{"id":"landscape","label":"Landscape 1.91:1","w":1200,"h":628}' onclick="selectFmt(this)">Landscape 1.91:1</button>
          </div>
        </div>
        <div class="card">
          <span class="lbl">OBJECTIVE</span>
          <div class="obj-row">
            <button class="obj-btn active" data-obj="OUTCOME_SALES" onclick="selectObj(this)"><div style="font-size:18px;margin-bottom:3px">💰</div>Sales</button>
            <button class="obj-btn" data-obj="OUTCOME_TRAFFIC" onclick="selectObj(this)"><div style="font-size:18px;margin-bottom:3px">🔗</div>Traffic</button>
            <button class="obj-btn" data-obj="OUTCOME_AWARENESS" onclick="selectObj(this)"><div style="font-size:18px;margin-bottom:3px">📡</div>Awareness</button>
          </div>
        </div>
        <div class="card">
          <span class="lbl">ARTWORK DETAILS</span>
          <textarea id="productInfo" rows="4" placeholder="Title, medium, size, price…&#10;&#10;E.g: 'Mediterranean Morning' — oil on linen, 80×100cm, €2,400. Only 1 available."></textarea>
        </div>
        <button class="btn-primary" id="generateBtn" onclick="generate()" disabled>Upload content first</button>
      </div>
    </div>
  </div>

  <!-- WORKING STAGE -->
  <div id="workingStage" class="hidden">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="step-text" id="stepText">Processing...</div>
      <div class="progress-bar-wrap hidden" id="progressWrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div style="font-size:11px;color:#c9a96e;font-family:monospace;margin-top:6px" id="progressText"></div>
      </div>
      <div class="step-sub">Applying conversion science · competitor analysis · neuromarketing</div>
    </div>
  </div>

  <!-- DONE STAGE -->
  <div id="doneStage" class="hidden">
    <div class="result-grid">
      <div>
        <div class="output-toggle" id="outputToggle" style="display:none">
          <button class="toggle-btn active-video" onclick="showOutput('video')">🎬 Edited Video</button>
          <button class="toggle-btn" onclick="showOutput('image')">🖼 Image Creative</button>
        </div>
        <div class="output-preview" id="outputPreview"></div>
        <a id="downloadVideo" class="btn-download-video hidden" download="martamescar_ad.mp4">↓ Download MP4 — Upload to Meta</a>
        <button id="downloadImage" class="btn-download-image hidden" onclick="downloadImage()">↓ Download JPG — Upload to Meta</button>
        <button class="btn-ghost" style="margin-bottom:6px" onclick="generate()">↺ Regenerate</button>
        <button class="btn-ghost" onclick="resetApp()">+ New</button>
        <div id="resultError" class="error-box hidden"></div>
      </div>

      <div>
        <div class="tabs">
          <button class="tab-btn active" onclick="showTab(this,'creative')">Creative</button>
          <button class="tab-btn" onclick="showTab(this,'copy')">Ad Copy</button>
          <button class="tab-btn" onclick="showTab(this,'audience')">Audience</button>
          <button class="tab-btn" onclick="showTab(this,'campaign')">Campaign</button>
          <button class="tab-btn" onclick="showTab(this,'insights')">Insights</button>
        </div>

        <div id="tab-creative">
          <div class="stat-grid" id="statGrid"></div>
          <div id="editNotes"></div>
        </div>
        <div id="tab-copy" class="hidden">
          <div id="copyFields"></div>
        </div>
        <div id="tab-audience" class="hidden">
          <div id="audienceContent"></div>
        </div>
        <div id="tab-campaign" class="hidden">
          <div id="campaignContent"></div>
        </div>
        <div id="tab-insights" class="hidden">
          <div id="insightsContent"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
let state = {
  file: null, isVideo: false, preview: null,
  fmt: {id:"feed",label:"Feed 1:1",w:1080,h:1080},
  obj: "OUTCOME_SALES",
  captured: false,
  capturedBlob: null,
  result: null,
  imageBlob: null,
  videoUrl: null,
  activeOutput: "image"
};

// File handling
document.getElementById("fileInput").addEventListener("change", e => loadFile(e.target.files[0]));
document.getElementById("dropZone").addEventListener("dragover", e => e.preventDefault());
document.getElementById("dropZone").addEventListener("drop", e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

function loadFile(f) {
  if (!f) return;
  state.file = f;
  state.isVideo = f.type.startsWith("video/");
  state.captured = false; state.capturedBlob = null;
  state.result = null; state.imageBlob = null; state.videoUrl = null;
  showError("");

  const dz = document.getElementById("dropZone");
  dz.classList.add("has-file");
  document.getElementById("dropPlaceholder").classList.add("hidden");
  document.getElementById("changeFileBtn").style.display = "block";

  if (state.isVideo) {
    const vid = document.getElementById("videoPreview");
    vid.src = URL.createObjectURL(f);
    vid.classList.remove("hidden");
    document.getElementById("imagePreview").classList.add("hidden");
    document.getElementById("captureSection").classList.remove("hidden");
    document.getElementById("generateBtn").textContent = "Capture a frame first →";
    document.getElementById("generateBtn").disabled = true;
  } else {
    const img = document.getElementById("imagePreview");
    img.src = URL.createObjectURL(f);
    img.classList.remove("hidden");
    document.getElementById("videoPreview").classList.add("hidden");
    document.getElementById("captureSection").classList.add("hidden");
    document.getElementById("generateBtn").textContent = "→  Generate Everything";
    document.getElementById("generateBtn").disabled = false;
  }
}

function captureFrame() {
  const vid = document.getElementById("videoPreview");
  if (!vid.videoWidth) { showError("Video not ready — wait for it to load then try again"); return; }
  const c = document.createElement("canvas");
  c.width = vid.videoWidth; c.height = vid.videoHeight;
  c.getContext("2d").drawImage(vid, 0, 0);
  c.toBlob(blob => {
    if (!blob) { showError("Frame capture failed — try again"); return; }
    state.capturedBlob = blob;
    state.captured = true;
    const btn = document.getElementById("captureBtn");
    btn.textContent = "✓ Frame Captured — tap to recapture";
    btn.classList.add("captured");
    document.getElementById("generateBtn").textContent = "→  Generate Everything";
    document.getElementById("generateBtn").disabled = false;
  }, "image/jpeg", 0.92);
}

function selectFmt(btn) {
  document.querySelectorAll(".fmt-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.fmt = JSON.parse(btn.dataset.fmt);
}

function selectObj(btn) {
  document.querySelectorAll(".obj-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  state.obj = btn.dataset.obj;
}

function showError(msg) {
  const el = document.getElementById("errorBox");
  if (msg) { el.textContent = "✗ " + msg; el.classList.remove("hidden"); }
  else el.classList.add("hidden");
}

function setStage(s) {
  ["uploadStage","workingStage","doneStage"].forEach(id => document.getElementById(id).classList.add("hidden"));
  document.getElementById(s + "Stage").classList.remove("hidden");
}

function setStep(txt, pct) {
  document.getElementById("stepText").textContent = txt;
  if (pct !== undefined) {
    document.getElementById("progressWrap").classList.remove("hidden");
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = pct + "%";
  } else {
    document.getElementById("progressWrap").classList.add("hidden");
  }
}

async function generate() {
  if (!state.file) return;
  setStage("working");
  showError("");

  try {
    // 1. Get frame for analysis
    setStep("Preparing content for analysis...");
    let frameBlob = state.isVideo ? state.capturedBlob : state.file;

    // 2. Claude analysis
    setStep("Claude is analysing content with conversion science and competitor data...");
    const fd1 = new FormData();
    fd1.append("frame", frameBlob, "frame.jpg");
    fd1.append("format", JSON.stringify(state.fmt));
    fd1.append("objective", state.obj);
    fd1.append("productInfo", document.getElementById("productInfo").value);

    const r1 = await fetch("/api/analyse", { method: "POST", body: fd1 });
    if (!r1.ok) throw new Error("Analysis failed: " + await r1.text());
    state.result = await r1.json();

    // 3. Process image
    setStep("Applying AI edits — colour grade, warmth, overlays, typography...");
    const fd2 = new FormData();
    fd2.append("image", frameBlob, "image.jpg");
    fd2.append("params", JSON.stringify(state.result));
    fd2.append("format", JSON.stringify(state.fmt));

    const r2 = await fetch("/api/process-image", { method: "POST", body: fd2 });
    if (!r2.ok) throw new Error("Image processing failed");
    state.imageBlob = await r2.blob();

    // 4. Process video if applicable
    if (state.isVideo) {
      setStep("Processing video with FFmpeg...", 0);
      const fd3 = new FormData();
      fd3.append("video", state.file, "video.mp4");
      fd3.append("params", JSON.stringify(state.result));
      fd3.append("format", JSON.stringify(state.fmt));

      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/process-video");
      xhr.responseType = "blob";

      const videoBlob = await new Promise((res, rej) => {
        xhr.upload.onprogress = e => {
          if (e.lengthComputable) {
            const pct = Math.round(e.loaded / e.total * 50);
            setStep(`Uploading video for processing... ${pct}%`, pct);
          }
        };
        xhr.onprogress = e => setStep("Processing video with FFmpeg...", 75);
        xhr.onload = () => {
          if (xhr.status === 200) res(xhr.response);
          else rej(new Error("Video processing failed"));
        };
        xhr.onerror = () => rej(new Error("Network error"));
        xhr.send(fd3);
      });

      state.videoUrl = URL.createObjectURL(videoBlob);
      state.activeOutput = "video";
    } else {
      state.activeOutput = "image";
    }

    renderResult();
    setStage("done");

  } catch (e) {
    console.error(e);
    document.getElementById("errorBox").textContent = "✗ " + e.message;
    document.getElementById("errorBox").classList.remove("hidden");
    setStage("upload");
  }
}

function renderResult() {
  const d = state.result;

  // Output preview
  const preview = document.getElementById("outputPreview");
  const toggle = document.getElementById("outputToggle");

  if (state.isVideo && state.videoUrl) {
    toggle.style.display = "flex";
    showOutput("video");
  } else {
    toggle.style.display = "none";
    showOutput("image");
  }

  // Creative tab
  const cg = d.colorGrade || {};
  const statData = [
    ["CROP", `X:${Math.round((d.crop?.focusX||0.5)*100)}% Y:${Math.round((d.crop?.focusY||0.38)*100)}%`],
    ["BRIGHTNESS", `${cg.brightness>=0?"+":""}${cg.brightness||0}`],
    ["CONTRAST",   `${cg.contrast>=0?"+":""}${cg.contrast||0}`],
    ["SATURATION", `${cg.saturation>=0?"+":""}${cg.saturation||0}`],
    ["WARMTH",     `${cg.warmth>=0?"+":""}${cg.warmth||0}`],
    ["OVERLAY",    (d.overlay?.style||"none").replace(/_/g," ")],
    ["TEXT POS.",  d.headline?.position||"bottom"],
    ["FONT",       d.headline?.style||"serif"],
    ["HOOK",       d.hook?.text||"—"],
  ];
  document.getElementById("statGrid").innerHTML = statData.map(([l,v]) => `<div class="stat-box"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`).join("");
  let notes = "";
  if (d.colorGrade?.note) notes += `<div class="insight-dark" style="padding:11px 14px;border-radius:8px;font-size:12px;color:#6b6480;line-height:1.8;margin-bottom:8px"><strong style="color:#e8e4f0">Colour grade:</strong> ${d.colorGrade.note}</div>`;
  if (d.hook?.note) notes += `<div class="insight-dark" style="padding:11px 14px;border-radius:8px;font-size:12px;color:#6b6480;line-height:1.8"><strong style="color:#e8e4f0">Hook:</strong> ${d.hook.note}</div>`;
  document.getElementById("editNotes").innerHTML = notes;

  // Copy tab
  const cp = d.adCopy || {};
  document.getElementById("copyFields").innerHTML = [
    ["PRIMARY TEXT A — EMOTIONAL (≤125)", cp.primaryText, "pt"],
    ["HEADLINE (≤40)", cp.headline, "hl"],
    ["DESCRIPTION (≤30)", cp.description, "desc"],
    ["CTA BUTTON", (cp.cta||"").replace(/_/g," "), "cta"],
    ["VARIANT B — SOCIAL PROOF", cp.variantB, "vb"],
    ["VARIANT C — SCARCITY / URGENCY", cp.variantC, "vc"],
  ].map(([l,v,k]) => `
    <div class="copy-field">
      <span class="lbl">${l}</span>
      <div class="copy-row">
        <div class="copy-value">${v||""}</div>
        <button class="copy-btn" id="cpbtn-${k}" onclick="copyText('${(v||"").replace(/'/g,"\\'")}','${k}')">&xcopy;</button>
      </div>
    </div>
  `).join("") + `<button class="copy-all-btn" id="copyAllBtn" onclick="copyAll()">⎘ Copy all copy</button>`;

  // Audience tab
  const au = d.audience || {};
  document.getElementById("audienceContent").innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:#6b6480;line-height:1.8;margin-bottom:14px">${au.summary||""}</div>
      <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr">
        <div class="stat-box"><div class="stat-label">AGE</div><div class="stat-value">${au.ageRange||""}</div></div>
        <div class="stat-box"><div class="stat-label">GENDER</div><div class="stat-value">${au.genders||""}</div></div>
        <div class="stat-box"><div class="stat-label">REACH</div><div class="stat-value">${au.estimatedReach||""}</div></div>
      </div>
      <span class="lbl" style="margin-top:14px;display:block">LOCATIONS</span>
      <div style="margin-bottom:12px">${(au.locations||[]).map(v=>`<span class="tag">${v}</span>`).join("")}</div>
      <span class="lbl">INTEREST TARGETS</span>
      <div style="margin-bottom:12px">${(au.interests||[]).map(v=>`<span class="tag">${v}</span>`).join("")}</div>
      <span class="lbl">BEHAVIOURS</span>
      <div style="margin-bottom:12px">${(au.behaviors||[]).map(v=>`<span class="tag">${v}</span>`).join("")}</div>
      <span class="lbl">CUSTOM AUDIENCES</span>
      <div style="margin-bottom:12px">${(au.customAudiences||[]).map(v=>`<span class="tag">${v}</span>`).join("")}</div>
      <span class="lbl">LOOKALIKE</span>
      <div style="font-size:13px;color:#e8e4f0;margin-bottom:12px">${au.lookalike||""}</div>
      <span class="lbl">EXCLUSIONS</span>
      <div>${(au.exclusions||[]).map(v=>`<span class="tag">${v}</span>`).join("")}</div>
    </div>
    <div class="insight-gold" style="padding:12px 14px;border-radius:8px;margin-bottom:10px">
      <span class="lbl">TARGETING RATIONALE</span>
      <div style="font-size:12px;color:#6b6480;line-height:1.8">${au.whyThisAudience||""}</div>
    </div>
    <button class="copy-all-btn" id="audCopyBtn" onclick="copyAudience()">⎘ Copy audience settings</button>
  `;

  // Campaign tab
  const ca = d.campaign || {};
  document.getElementById("campaignContent").innerHTML = `
    <div class="card">
      <div class="stat-grid" style="grid-template-columns:1fr 1fr">
        <div class="stat-box"><div class="stat-label">DAILY BUDGET</div><div class="stat-value">${ca.budgetDaily||""}</div></div>
        <div class="stat-box"><div class="stat-label">BID STRATEGY</div><div class="stat-value">${ca.bidStrategy||""}</div></div>
        <div class="stat-box"><div class="stat-label">CTR TARGET</div><div class="stat-value">${ca.kpis?.ctr||""}</div></div>
        <div class="stat-box"><div class="stat-label">CPC TARGET</div><div class="stat-value">${ca.kpis?.cpc||""}</div></div>
        <div class="stat-box"><div class="stat-label">ROAS TARGET</div><div class="stat-value">${ca.kpis?.roas||""}</div></div>
      </div>
      <span class="lbl" style="margin-top:14px;display:block">PLACEMENTS</span>
      <div style="font-size:13px;color:#e8e4f0;line-height:1.6;margin-bottom:12px">${ca.placements||""}</div>
      <span class="lbl">BEST SCHEDULE</span>
      <div style="font-size:13px;color:#e8e4f0;line-height:1.6;margin-bottom:12px">${ca.schedule||""}</div>
      <span class="lbl">A/B TEST FIRST</span>
      <div style="font-size:13px;color:#e8e4f0;line-height:1.6">${ca.abTest||""}</div>
    </div>
    <div class="card">
      <span class="lbl">WEEK 1 ACTIONS</span>
      ${(ca.week1||[]).map((a,i)=>`<div class="action-row"><div class="action-num">${i+1}</div><div style="font-size:13px;color:#e8e4f0;line-height:1.6">${a}</div></div>`).join("")}
    </div>
    <button class="copy-all-btn" id="campCopyBtn" onclick="copyCampaign()">⎘ Copy campaign settings</button>
  `;

  // Insights tab
  document.getElementById("insightsContent").innerHTML = `
    ${d.analysis?`<div class="insight-dark" style="padding:14px;border-radius:10px;margin-bottom:12px"><span class="lbl">CONTENT ANALYSIS</span><div style="font-size:13px;color:#6b6480;line-height:1.8">${d.analysis}</div></div>`:""}
    ${d.conversionInsights?`<div class="insight-blue" style="padding:14px;border-radius:10px;margin-bottom:12px"><span class="lbl">CONVERSION SCIENCE · COMPETITOR DATA · PSYCHOLOGY</span><div style="font-size:13px;color:#6b6480;line-height:1.8">${d.conversionInsights}</div></div>`:""}
    ${d.hook?.note?`<div class="insight-dark" style="padding:14px;border-radius:10px;margin-bottom:12px"><span class="lbl">HOOK PSYCHOLOGY</span><div style="font-size:13px;color:#6b6480;line-height:1.8">${d.hook.note}</div></div>`:""}
    ${d.overlay?.note?`<div class="insight-dark" style="padding:14px;border-radius:10px;margin-bottom:12px"><span class="lbl">OVERLAY RATIONALE</span><div style="font-size:13px;color:#6b6480;line-height:1.8">${d.overlay.note}</div></div>`:""}
    ${d.headline?.note?`<div class="insight-dark" style="padding:14px;border-radius:10px"><span class="lbl">TYPOGRAPHY PLACEMENT</span><div style="font-size:13px;color:#6b6480;line-height:1.8">${d.headline.note}</div></div>`:""}
  `;
}

function showOutput(type) {
  state.activeOutput = type;
  const preview = document.getElementById("outputPreview");
  const dlV = document.getElementById("downloadVideo");
  const dlI = document.getElementById("downloadImage");
  document.querySelectorAll(".toggle-btn").forEach(b => { b.classList.remove("active-video","active-image"); });

  if (type === "video" && state.videoUrl) {
    preview.innerHTML = `<video src="${state.videoUrl}" controls></video>`;
    dlV.href = state.videoUrl; dlV.classList.remove("hidden"); dlI.classList.add("hidden");
    document.querySelectorAll(".toggle-btn")[0].classList.add("active-video");
  } else {
    const url = state.imageBlob ? URL.createObjectURL(state.imageBlob) : "";
    preview.innerHTML = `<img src="${url}" alt="Ad creative" id="outputImg">`;
    dlV.classList.add("hidden"); dlI.classList.remove("hidden");
    document.querySelectorAll(".toggle-btn")[1]?.classList.add("active-image");
  }
}

function downloadImage() {
  if (!state.imageBlob) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(state.imageBlob);
  a.download = `martamescar_${state.fmt.id}_ad.jpg`;
  a.click();
}

function showTab(btn, id) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll("[id^='tab-']").forEach(el => el.classList.add("hidden"));
  document.getElementById("tab-" + id).classList.remove("hidden");
}

function copyText(text, key) {
  navigator.clipboard.writeText(text).catch(() => {});
  const btn = document.getElementById("cpbtn-" + key);
  if (btn) { btn.textContent = "✓"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = "⎘"; btn.classList.remove("copied"); }, 2000); }
}

function copyAll() {
  const cp = state.result?.adCopy || {};
  const txt = `A:\n${cp.primaryText}\n\nHEADLINE: ${cp.headline}\nDESCRIPTION: ${cp.description}\nCTA: ${cp.cta}\n\nB:\n${cp.variantB}\n\nC:\n${cp.variantC}`;
  navigator.clipboard.writeText(txt).catch(() => {});
  const btn = document.getElementById("copyAllBtn");
  if (btn) { btn.textContent = "✓ Copied"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = "⎘ Copy all copy"; btn.classList.remove("copied"); }, 2000); }
}

function copyAudience() {
  const au = state.result?.audience || {};
  const txt = `AUDIENCE\nAge: ${au.ageRange} | Gender: ${au.genders} | Reach: ${au.estimatedReach}\nLocations: ${(au.locations||[]).join(", ")}\nInterests: ${(au.interests||[]).join(", ")}\nBehaviours: ${(au.behaviors||[]).join(", ")}\nCustom: ${(au.customAudiences||[]).join(", ")}\nLookalike: ${au.lookalike}\nExclusions: ${(au.exclusions||[]).join(", ")}\n\n${au.whyThisAudience}`;
  navigator.clipboard.writeText(txt).catch(() => {});
  const btn = document.getElementById("audCopyBtn");
  if (btn) { btn.textContent = "✓ Copied"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = "⎘ Copy audience settings"; btn.classList.remove("copied"); }, 2000); }
}

function copyCampaign() {
  const ca = state.result?.campaign || {};
  const txt = `CAMPAIGN\nBudget: ${ca.budgetDaily} | Bid: ${ca.bidStrategy}\nCTR: ${ca.kpis?.ctr} | CPC: ${ca.kpis?.cpc} | ROAS: ${ca.kpis?.roas}\nPlacements: ${ca.placements}\nSchedule: ${ca.schedule}\nA/B: ${ca.abTest}\n\nWEEK 1:\n${(ca.week1||[]).map((a,i)=>`${i+1}. ${a}`).join("\n")}`;
  navigator.clipboard.writeText(txt).catch(() => {});
  const btn = document.getElementById("campCopyBtn");
  if (btn) { btn.textContent = "✓ Copied"; btn.classList.add("copied"); setTimeout(() => { btn.textContent = "⎘ Copy campaign settings"; btn.classList.remove("copied"); }, 2000); }
}

function resetApp() {
  state = { file:null, isVideo:false, preview:null, fmt:{id:"feed",label:"Feed 1:1",w:1080,h:1080}, obj:"OUTCOME_SALES", captured:false, capturedBlob:null, result:null, imageBlob:null, videoUrl:null, activeOutput:"image" };
  document.getElementById("dropZone").classList.remove("has-file");
  document.getElementById("dropPlaceholder").classList.remove("hidden");
  document.getElementById("videoPreview").classList.add("hidden");
  document.getElementById("imagePreview").classList.add("hidden");
  document.getElementById("captureSection").classList.add("hidden");
  document.getElementById("changeFileBtn").style.display = "none";
  document.getElementById("generateBtn").disabled = true;
  document.getElementById("generateBtn").textContent = "Upload content first";
  document.getElementById("captureBtn").classList.remove("captured");
  document.getElementById("captureBtn").textContent = "⬛ Pause video + Capture Frame";
  document.getElementById("fileInput").value = "";
  showError("");
  setStage("upload");
}
</script>
</body>
</html>
